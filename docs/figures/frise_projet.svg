<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" role="img" aria-labelledby="frise-projet-title frise-projet-desc">
<title id="frise-projet-title">Étapes du projet ATLAS</title>
<desc id="frise-projet-desc">Frise des étapes du projet sur trois jours, du cadrage sur le blé à l'analyse pré-spécifiée du maïs irrigué et non irrigué, puis aux vérifications ajoutées ensuite.</desc>
<style>.n{fill:#2d3142;font:600 12px 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;text-anchor:middle}.nb{fill:#2d3142;font:600 14px 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;text-anchor:middle}.s{fill:#4f5d75;font:400 9px 'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;text-anchor:middle}.lab{font:400 8px 'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;letter-spacing:0.12em;text-anchor:middle}.d{font:400 8px 'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;letter-spacing:0.14em;text-anchor:middle}.lg{fill:#4f5d75;font:400 8.5px 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif}.lgh{fill:#4f5d75;font:400 8px 'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;letter-spacing:0.18em}</style>
<defs><marker id="frise-projet-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="frise-projet-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs>
