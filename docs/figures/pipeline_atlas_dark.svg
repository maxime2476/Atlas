<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956 464" width="956" height="464" role="img" aria-labelledby="pipeline-atlas-dark-title pipeline-atlas-dark-desc">
<title id="pipeline-atlas-dark-title">Chaîne de données d'ATLAS</title>
<desc id="pipeline-atlas-dark-desc">Les fichiers bruts téléchargés, jamais modifiés, deviennent des tables intermédiaires, puis des panels départementaux, puis des tables de résultats estimées en R et en Python, dont sont générés les chiffres du mémoire.</desc>
<style>.t{fill:#f5f5f5;font:600 13px 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;text-anchor:middle}.b{fill:#bfc0c0;font:400 9px 'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;text-anchor:middle}.fl{fill:#f5f5f5;font:600 11px 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif}.fv{fill:#bfc0c0;font:400 9px 'Geist Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}.el{fill:#949eb2;font:500 8px 'Geist Mono',ui-monospace,Menlo,Consolas,monospace;letter-spacing:0.08em}.al{font:500 10px 'Geist Mono',ui-monospace,Menlo,Consolas,monospace;letter-spacing:0.08em;text-anchor:middle}.pt{fill:#f5f5f5;font:500 7px 'Geist Mono',ui-monospace,Menlo,Consolas,monospace;letter-spacing:0.08em;text-anchor:middle}.ph{fill:#f5f5f5;font:600 11px 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif}.ps{fill:#bfc0c0;font:400 9px 'Geist Mono',ui-monospace,Menlo,Consolas,monospace}</style>
